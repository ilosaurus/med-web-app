<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEHATIN - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .logo {
      width: 200px;
      margin-bottom: 1rem;
    }

    .logo img {
      width: 100%;
      height: auto;
    }

    .form-container {
      background-color: #22263e;
      padding: 2rem;
      border-radius: 1.25rem;
      width: 100%;
      max-width: 400px;
    }

    .form-container input {
      margin-bottom: 1rem;
      border-radius: 0.8rem;
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
    }

    .form-container button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1.2rem;
      border-radius: 0.8rem;
      background-color: #6754e2;
      border: none;
      color: white;
      margin-bottom: 1rem;
      transition: all 0.3s ease;
    }

    .form-container button:hover {
      opacity: 0.9;
      box-shadow: 0px 4px 20px rgba(103, 84, 226, 0.5);
      transform: translateY(-3px);
    }

    .form-container button:active {
      opacity: 0.8;
      box-shadow: 0px 4px 10px rgba(103, 84, 226, 0.5);
      transform: translateY(0px);
    }

    .bottom-buttons {
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      padding: 1rem;
      padding-top: 3rem;
      padding-right: 2rem;
      padding-bottom: 1.5rem;
      padding-left: 2rem;
      background-color: #22263e;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 999;
      border-top-left-radius: 3.40rem;
      border-top-right-radius: 3.40rem;
    }

    .bottom-buttons a {
      font-size: 1rem;
      color: #fff;
      text-decoration: none;
    }

    .back-btn {
      position: absolute;
      top: 2rem;
      left: 1rem;
      background: transparent;
      border: none;
      color: #6754e2;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- <button class="back-btn"><i class="bi bi-arrow-left"></i> Back</button> -->

  <div class="container">
    <div class="logo">
      <img src="https://sehatin.rizcasaur.us/assets/images/sehatin-logo.svg" alt="SEHATIN Logo">
    </div>
    <h3 style="margin-bottom: 28rem; color: #6754e2;">Get Better Yourself</h4>
  </div>

  <div class="bottom-buttons">
    <div class="form-container">
        <h3 class="text-white mb-3">Sign in to continue</h3>

        <input type="email" class="form-control" placeholder="Email" value="mrwintan2605@gmail.com">
        <input type="password" class="form-control" placeholder="Password" value="******">
        <button type="submit">Login</button>

        <!-- Forgot Password and Register Link -->
        <p class="text-white">
            <a href="#" class="text-light">Lupa Password?</a>
            <br>
            <a href="#" class="text-light">Daftar Akun!</a>
        </p>
    </div>
    <!-- <button class="btn btn-primary">Login</button>
    <button class="btn btn-outline-secondary">Sign Up</button> -->
    <h6 style="color: rgba(211, 215, 220, 0.581);">V.1.20.650</h6>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
