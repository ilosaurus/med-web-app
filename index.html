<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical App UI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f5fa;
      color: #333;
      font-family: 'Segoe UI', sans-serif;
      padding-bottom: 70px; /* For fixed footer space */
    }
    .top-section {
      background-color: #6754e2;
      color: white;
      padding: 1.5rem;
      border-bottom-left-radius: 1.5rem;
      border-bottom-right-radius: 1.5rem;
    }
    .card {
      background-color: #fff;
      color: #000;
      border-radius: 1rem;
    }
    .section-title {
      font-weight: bold;
      margin-top: 1rem;
    }
    .icon-box {
      text-align: center;
      font-size: 0.9rem;
    }
    .icon-box i {
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
      display: block;
    }
    .profile-pic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .doctor-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 0.5rem;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #6754e2;
      color: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 999;
    }
    .bottom-nav a {
      color: white;
      text-decoration: none;
      font-size: 0.75rem;
      text-align: center;
    }
    .bottom-nav a i {
      font-size: 1.4rem;
      display: block;
    }
  </style>
</head>
<body>
  <div class="top-section">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
          <small>Welcome</small>
          <h6 class="mb-0">Dani Martinez</h6>
        </div>
        <img src="https://randomuser.me/api/portraits/men/44.jpg" alt="Profile" class="profile-pic">
      </div>
      <input type="text" class="form-control" placeholder="Search doctor">
    </div>
  </div>

  <div class="container py-3">
    <div class="d-flex justify-content-between align-items-center">
      <div class="section-title">Categories</div>
      <a href="#" class="text-decoration-none text-primary">Show All</a>
    </div>
    <div class="row text-center g-2">
      <div class="col-4">
        <div class="card icon-box p-2">
          <i class="bi bi-person-vcard"></i>Consultation
        </div>
      </div>
      <div class="col-4">
        <div class="card icon-box p-2">
          <i class="bi bi-emoji-smile"></i>Dentist
        </div>
      </div>
      <div class="col-4">
        <div class="card icon-box p-2">
          <i class="bi bi-heart-pulse"></i>Cardiologist
        </div>
      </div>
      <div class="col-4">
        <div class="card icon-box p-2">
          <i class="bi bi-hospital"></i>Hospital
        </div>
      </div>
      <div class="col-4">
        <div class="card icon-box p-2">
          <i class="bi bi-truck"></i>Emergency
        </div>
      </div>
      <div class="col-4">
        <div class="card icon-box p-2">
          <i class="bi bi-flask"></i>Laboratory
        </div>
      </div>
    </div>

    <div class="section-title">Top doctors</div>
    <div class="row g-3">
      <div class="col-12">
        <div class="card d-flex flex-row align-items-center p-2">
          <img src="https://randomuser.me/api/portraits/women/50.jpg" class="doctor-img me-3" alt="Doctor">
          <div>
            <strong>dr. Olivia Wilson</strong>
            <div>Consultant – Physiotherapy</div>
            <small class="text-warning">⭐ 4.9 (57 Reviews)</small>
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="card d-flex flex-row align-items-center p-2">
          <img src="https://randomuser.me/api/portraits/men/51.jpg" class="doctor-img me-3" alt="Doctor">
          <div>
            <strong>dr. Jonathan Patterson</strong>
            <div>Consultant – Internal Medicine</div>
            <small class="text-warning">⭐ 4.9 (57 Reviews)</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fixed Bottom Navigation -->
  <div class="bottom-nav">
    <a href="#">
      <i class="bi bi-house-door-fill"></i>
      <span>Home</span>
    </a>
    <a href="#">
      <i class="bi bi-person-lines-fill"></i>
      <span>Doctors</span>
    </a>
    <a href="#">
      <i class="bi bi-calendar-event"></i>
      <span>Appointment</span>
    </a>
    <a href="#">
      <i class="bi bi-person-fill"></i>
      <span>Profile</span>
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
