<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEHATIN</title>
  <link rel="icon" type="image/png" href="https://sehatin.rizcasaur.us/assets/images/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="https://sehatin.rizcasaur.us/assets/images/favicon.svg" />
  <link rel="shortcut icon" href="https://sehatin.rizcasaur.us/assets/images/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://sehatin.rizcasaur.us/assets/images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="SEHATIN" />
  <link rel="manifest" href="https://sehatin.rizcasaur.us/manifest.json">
  
  <link rel="stylesheet" href="https://sehatin.rizcasaur.us/assets/css/fonts/poppins-fonts.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .logo {
      width: 200px;
      margin-bottom: 1rem;
    }

    .logo img {
      width: 100%;
      height: auto;
    }
    
    .btn-primary, .btn-outline-secondary {
      width: 100%;
      padding: 0.75rem;
      font-size: 1.15rem;
      border-radius: 0.8rem;
      transition: all 0.3s ease;
      font-family: Poppins Semibold;
    }

    .btn-primary {
      background-color: #6754e2;
      border: none;
      color: white;
    }

    .btn-outline-secondary {
      background-color: #22263e;
      border: 3px solid #6754e2;
      color: white;
      margin-bottom: 8rem;
    }

    .btn-primary:hover, .btn-outline-secondary:hover {
      opacity: 0.9;
      box-shadow: 0px 4px 20px rgba(103, 84, 226, 0.5);
      transform: translateY(-3px);
    }

    .btn-primary:active, .btn-outline-secondary:active {
      opacity: 0.8;
      box-shadow: 0px 4px 10px rgba(103, 84, 226, 0.5);
      transform: translateY(0px);
    }

    /* Fix the buttons at the bottom */
    .bottom-buttons {
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      padding: 1rem;
      padding-top: 6rem;
      padding-right: 6rem;
      padding-bottom: 0.60rem;
      padding-left: 6rem;
      background-color: #22263e;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 999;
      border-top-left-radius: 3.40rem;
      border-top-right-radius: 3.40rem;
    }

    .bottom-buttons .btn {
      margin-bottom: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="https://sehatin.rizcasaur.us/assets/images/sehatin-logo.svg" alt="SEHATIN Logo">
    </div>
    <h3 style="margin-bottom: 15rem; color: #6754e2;font-family: Poppins Semibold;">Get Better Yourself</h4>
  </div>

  <div class="bottom-buttons">
    <a href="login.html" class="btn btn-primary mb-2" role="button" aria-pressed="true">Login</a>
    <a href="#" class="btn btn-outline-secondary" role="button" aria-pressed="true">Daftar Akun</a>
    <br><br>
    <h6 style="color: rgba(211, 215, 220, 0.581); font-family: Poppins Semibold;">V.1.20.650</h6>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Detect touch event to simulate hover
    const buttons = document.querySelectorAll('.btn');

    buttons.forEach(button => {
    // Use passive: true for better performance
    button.addEventListener('touchstart', () => {
        button.classList.add('active');
    }, { passive: true });

    button.addEventListener('touchend', () => {
        button.classList.remove('active');
    }, { passive: true });
    });
  </script>
</body>
</html>
