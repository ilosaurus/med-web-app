<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEHATIN - PROFILE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .logo {
      width: 120px;
      margin-bottom: 1rem;
    }
    .logo img {
      width: 100%;
      height: auto;
    }
    .btn-primary, .btn-outline-secondary {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 0.8rem;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background-color: #6754e2;
      border: none;
      color: white;
    }

    .btn-outline-secondary {
      background-color: #22263e;
      border: 3px solid #6754e2;
      color: white;
    }

    .btn-primary:hover, .btn-outline-secondary:hover {
      opacity: 0.9;
      box-shadow: 0px 4px 20px rgba(103, 84, 226, 0.5);
      transform: translateY(-3px);
    }

    .btn-primary:active, .btn-outline-secondary:active {
      opacity: 0.8;
      box-shadow: 0px 4px 10px rgba(103, 84, 226, 0.5);
      transform: translateY(0px);
    }

    /* Fix the buttons at the bottom */
    .bottom-buttons {
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      padding: 1rem;
      padding-top: 6rem;
      padding-right: 6rem;
      padding-bottom: 6rem;
      padding-left: 6rem;
      background-color: #22263e;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 999;
      border-top-left-radius: 3.40rem;
      border-top-right-radius: 3.40rem;
    }

    .bottom-buttons .btn {
      margin-bottom: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="https://sehatin.rizcasaur.us/assets/images/web-app-manifest-192x192.png" alt="SEHATIN Logo">
    </div>
    <h2>SEHATIN</h2>
    <p>Get better yourself</p>
  </div>

  <div class="bottom-buttons">
    <button class="btn btn-primary mb-2">Login</button>
    <button class="btn btn-outline-secondary">Sign Up</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Detect touch event to simulate hover
    const buttons = document.querySelectorAll('.btn');

    buttons.forEach(button => {
      button.addEventListener('touchstart', () => {
        button.classList.add('active');
      });

      button.addEventListener('touchend', () => {
        button.classList.remove('active');
      });
    });
  </script>
</body>
</html>
