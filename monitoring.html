<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Medical App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom right, #e9ebff, #ffffff);
      font-family: 'Segoe UI', sans-serif;
      padding-bottom: 80px;
    }
    .top-section {
      background-color: #6754e2;
      color: white;
      padding: 2rem 1rem 2.5rem;
      border-bottom-left-radius: 1.5rem;
      border-bottom-right-radius: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    .profile-pic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 0.75rem;
      border: 3px solid #fff;
    }
    .section-title {
      font-weight: bold;
      font-size: 1.3rem;
      margin: 2rem 0 1rem;
      color: #333;
    }
    .info-box {
      background-color: #fff;
      border-radius: 1.25rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    .info-label {
      font-weight: 600;
      color: #555;
      font-size: 1rem;
    }
    .info-value {
      font-weight: 600;
      color: #111;
      font-size: 1rem;
    }
    .progress-bar-container {
      background-color: #e9ecef;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
      width: 160px;
    }
    .progress-bar-fill {
      height: 10px;
      background-color: #6754e2;
    }
    .mood-icon {
      font-size: 3rem;
      margin-bottom: 0.75rem;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #6754e2;
      color: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 999;
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
    }
    .bottom-nav a {
      color: white;
      text-decoration: none;
      font-size: 0.8rem;
      text-align: center;
    }
    .bottom-nav a i {
      font-size: 1.5rem;
      display: block;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="top-section">
    <img src="https://randomuser.me/api/portraits/men/44.jpg" alt="Profile" class="profile-pic">
    <h5 class="mb-0">Marwah Intan Tandipayuk</h5>
    <small>Health Monitoring</small>
  </div>

  <div class="container py-4">
    <div class="section-title">Pemantauan Kesehatan</div>
    <div class="info-box">
      <div class="info-item">
        <div class="info-label">Tekanan Darah</div>
        <div class="info-value">120/80 mmHg</div>
      </div>
      <div class="info-item">
        <div class="info-label">Gula Darah</div>
        <div class="info-value">98 mg/dL</div>
      </div>
      <div class="info-item">
        <div class="info-label">Detak Jantung</div>
        <div class="info-value">72 bpm</div>
      </div>
    </div>

    <div class="section-title">Mood Tracker</div>
    <div class="info-box text-center">
      <div class="mood-icon">😊</div>
      <div class="info-label">Mood Hari Ini:</div>
      <div class="info-value">Bahagia</div>
    </div>

    <div class="section-title">Aktivitas Fisik</div>
    <div class="info-box">
      <div class="info-item">
        <div>
          <div class="info-label">Langkah</div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: 75%"></div>
          </div>
        </div>
        <div class="info-value">7.542</div>
      </div>
      <div class="info-item">
        <div>
          <div class="info-label">Olahraga</div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: 60%"></div>
          </div>
        </div>
        <div class="info-value">30 menit</div>
      </div>
      <div class="info-item">
        <div>
          <div class="info-label">Tidur</div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: 80%"></div>
          </div>
        </div>
        <div class="info-value">6 jam 45 menit</div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="#"><i class="bi bi-house-door-fill"></i><span>Home</span></a>
    <a href="#"><i class="bi bi-person-lines-fill"></i><span>Doctors</span></a>
    <a href="#"><i class="bi bi-calendar-event"></i><span>Appointment</span></a>
    <a href="#"><i class="bi bi-person-fill"></i><span>Profile</span></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
