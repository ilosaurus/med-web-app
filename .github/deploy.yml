name: Deploy Static Website to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Copy static files to /var/www/medapp
        run: |
          # Copy the root HTML file (index.html)
          sudo cp -v ./index.html /var/www/medapp/
          sudo cp -v ./profile.xml /var/www/medapp/

          # Copy the entire public folder (for favicon.ico and other assets)
          sudo cp -rv ./assets /var/www/medapp/

          # Copy the entire src folder (assets, css, js, etc.)
          sudo chown -R :www-data /var/www/medapp
          sudo chmod -R 775 /var/www/medapp
          sudo ls -l /var/www/medapp/
          sudo tree /var/www/medapp/